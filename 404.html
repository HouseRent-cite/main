<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена</title>
  <meta name="robots" content="noindex">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5efe6;color:#231d18;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
    h1{font-size:64px;margin:0;color:#8a5a3b;font-family:Georgia,serif}
    a{display:inline-block;margin-top:20px;padding:14px 26px;border-radius:999px;background:#2f3a2c;color:#fff;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>Такой страницы нет. Возможно, ссылка устарела.</p>
    <a id="home" href="/">На главную</a>
  </div>
  <script>
    // На адресе вида имя.github.io/репозиторий/ ведём на корень репозитория
    var parts = location.pathname.split('/').filter(Boolean);
    if (location.hostname.endsWith('github.io') && parts.length) document.getElementById('home').href = '/' + parts[0] + '/';
  </script>
</body>
</html>
